[options]
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Required

[nbshell]
# Internal preview packages are covered by the ISO checksum but are not yet
# signed with a dedicated nbshell package key. Publication builds must replace
# this with Required TrustedOnly and import the release key.
SigLevel = Optional TrustAll
Server = file:///var/cache/nbshell/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
