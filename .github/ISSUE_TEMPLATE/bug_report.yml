name: Bug report
description: Report a reproducible problem in nbshell
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Do not include credentials or private logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Arch-based distribution, niri version, Quickshell version, and nbshell revision.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove names, paths, tokens, calendar data, and other personal information.
      render: shell
