name: Fehler melden
description: Einen reproduzierbaren Fehler in nbshell melden
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Danke fuer den Bericht. Bitte keine Zugangsdaten oder privaten Logs einfuegen.
  - type: textarea
    id: problem
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert und was hast du erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: Arch-Derivat, niri-Version, Quickshell-Version und relevanter nbshell-Stand.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Bereinigte Logs
      description: Entferne Namen, Pfade, Tokens, Kalenderdaten und andere persoenliche Angaben.
      render: shell
