name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag and release metadata
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          ./tests/release-audit.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build manual
        run: |
          pip install --requirement requirements-docs.txt
          mkdocs build --strict
          (cd site && zip -qr ../nbshell-manual.zip .)

      - name: Build verified installer artifact
        run: |
          version="$(cat VERSION)"
          archive="nbshell-${version}.tar.gz"
          git archive --format=tar --prefix="nbshell-${version}/" "${GITHUB_SHA}" | gzip -9 > "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign installer artifact with GitHub OIDC
        env:
          COSIGN_YES: "true"
        run: |
          version="$(cat VERSION)"
          archive="nbshell-${version}.tar.gz"
          cosign sign-blob --bundle "${archive}.sigstore.json" "${archive}"

      - name: Verify installer signature with the consumer policy
        run: |
          version="$(cat VERSION)"
          archive="nbshell-${version}.tar.gz"
          cosign verify-blob "${archive}" \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$(cat VERSION)" == *-* ]] && prerelease+=(--prerelease)
          version="$(cat VERSION)"
          gh release create "${GITHUB_REF_NAME}" nbshell-manual.zip \
            "nbshell-${version}.tar.gz" "nbshell-${version}.tar.gz.sha256" \
            "nbshell-${version}.tar.gz.sigstore.json" \
            --title "nbshell $(cat VERSION)" \
            --generate-notes "${prerelease[@]}"
