name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag and release metadata
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          ./tests/release-audit.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build manual
        run: |
          pip install --requirement requirements-docs.txt
          mkdocs build --strict
          (cd site && zip -qr ../nbshell-manual.zip .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$(cat VERSION)" == *-* ]] && prerelease+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" nbshell-manual.zip \
            --title "nbshell $(cat VERSION)" \
            --generate-notes "${prerelease[@]}"
