name: Validate

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test dependencies
        run: >-
          pacman -Syu --noconfirm git bash make python python-atspi jq nodejs shadow gcc pkgconf wayland qt6-declarative
          debugedit fakeroot meson ninja quickshell dbus libnotify python-gobject
          wayland-protocols bubblewrap diffutils ttf-dejavu

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the complete repository test gate
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: ""
          QT_QUICK_BACKEND: software
        run: |
          useradd --create-home nbshell-ci
          chown -R nbshell-ci:nbshell-ci "${GITHUB_WORKSPACE}"
          install -d -m 0700 -o nbshell-ci -g nbshell-ci /tmp/nbshell-ci-runtime
          runuser -u nbshell-ci -- env XDG_RUNTIME_DIR=/tmp/nbshell-ci-runtime ./tests/all.sh

      # The headless CI image verifies the installed greeter payload in the
      # fresh-install test. Full QML/Umbriel/greetd integration remains part of the
      # documented local release gate because it requires the desktop stack.
