name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install --requirement requirements-docs.txt
      - run: mkdocs build --strict
      # The private repository's current GitHub plan does not provide Pages.
      # Keep a complete static build as an artifact; this can switch to the
      # official Pages actions as soon as the repository becomes public.
      - uses: actions/upload-artifact@v4
        with:
          name: nbshell-manual
          path: site
