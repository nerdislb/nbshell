site_name: nbshell Manual
site_description: User guide for the nbshell desktop on Niri
site_url: https://nerdislb.github.io/nbshell/
repo_url: https://github.com/nerdislb/nbshell
repo_name: nerdislb/nbshell
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep-orange
      toggle:
        icon: material/weather-night
        name: Use dark mode

nav:
  - Welcome: index.md
  - Getting started: getting-started.md
  - Features: features.md
  - Compatibility: compatibility.md
  - Join the beta: beta-invitation.md
  - Beta testing: beta-testing.md
  - Grid-scroll: grid-scroll.md
  - Umbriel compositor: umbriel.md
  - Troubleshooting: troubleshooting.md
  - Phone webcam: phone-webcam.md
  - Video trimming: video-trimming.md
  - Browser themes: browser-themes.md
  - Plugin store: plugin-store.md
  - Plugin development: plugin-development.md
  - Releasing: releasing.md
  - Project media: project-media.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

plugins:
  - search
