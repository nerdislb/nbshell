# nbshell integration for Umbriel. Include this file from
# ~/.config/umbriel/config.toml; it contains only shell-owned binds and rules.

[include]
files = ["nbshell-outputs.toml", "nbshell-cursor.toml", "nbshell-overview.toml"]

[input.keyboard]
layout = "de"

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.5

[layout.scrolling]
default_width_fraction = 0.667

[appearance]
animation_ms = 300

[hot_corners.top_left]
enabled = true
delay_ms = 350
action = "overview-open"

[keybinds]
"Mod+Return" = "spawn:ghostty"
"Mod+Q" = "window-close"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
