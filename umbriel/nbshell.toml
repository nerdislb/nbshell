[[window_rule]]
match.title = "^nbshell Notes$"
default_floating = true
default_focused = true
default_size = [1100, 760]

[[window_rule]]
match.title = "^nbshell Calculator$"
default_floating = true
default_focused = true
default_size = [430, 650]

[[window_rule]]
match.title = "^nbshell-screensaver$"
default_fullscreen = true
default_focused = true

[[window_rule]]
match.title = "^nbshell-gaming$"
default_floating = true
default_focused = true
default_size = [1100, 780]

[[window_rule]]
match.app_id = "^zen"
match.title = "^(Picture-in-Picture|Bild-im-Bild)$"
default_floating = true
default_position = { x = 16, y = 16, anchor = "bottom_right" }

[[window_rule]]
match.app_id = "^scrcpy$"
match.title = "^Pixel 9 Pro · nbphone$"
default_floating = true
default_position = { x = 16, y = 16, anchor = "bottom_right" }

[[window_rule]]
match.app_id = "^omacut$"
default_floating = true
default_focused = true
default_size = [1100, 780]

[[window_rule]]
match.app_id = "^mpv$"
match.title = "^Phone Camera Preview$"
default_floating = true
default_focused = true
default_size = [900, 520]
default_position = { x = 16, y = 16, anchor = "bottom_right" }

[[window_rule]]
match.app_id = "^dev[.]nerdi[.]nbshell[.]agent[.]quick[.].*$"
default_floating = true
default_focused = true
default_size = [1100, 780]

[[window_rule]]
match.title = "^(Omamail|YouTube Music|Pit Wall)$"
default_floating = true
default_focused = true
default_size = [1240, 840]

[[layer_rule]]
match.namespace = "^nbshell:.*$"
blur = true
blur_ignore_alpha = 0.45
blur_popups = true

# The main menu is a full-screen layer surface. Keeping compositor blur on it
# hides live wallpaper and theme changes while its integrated settings page is
# open, so later rule values deliberately disable blur for this surface only.
[[layer_rule]]
match.namespace = "^nbshell:menu$"
blur = false
blur_popups = false

[[layer_rule]]
match.namespace = "^nbshell:settings$"
blur = false
blur_popups = false
